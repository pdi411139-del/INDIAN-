
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APNA INDIA - Open World Demo</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
  touch-action: none;
}
#game { width: 100vw; height: 100vh; display: block; }
#title {
  position: absolute;
  top: 12px;
  left: 12px;
  color: white;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 2px 2px 4px black;
}
#info {
  position: absolute;
  top: 42px;
  left: 12px;
  color: white;
  font-size: 12px;
  text-shadow: 1px 1px 3px black;
}
#message {
  position: absolute;
  top: 15%;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 2px 2px 4px black;
  pointer-events: none;
}
.controls {
  position: absolute;
  bottom: 22px;
  left: 18px;
  display: grid;
  grid-template-columns: 55px 55px 55px;
  grid-template-rows: 55px 55px;
  gap: 5px;
}
button {
  border: 1px solid #ffffff88;
  border-radius: 14px;
  background: #111a;
  color: white;
  font-size: 23px;
  font-weight: bold;
  touch-action: none;
}
button:active { background: #ffffff66; }
#up { grid-column: 2; }
#left { grid-column: 1; grid-row: 2; }
#down { grid-column: 2; grid-row: 2; }
#right { grid-column: 3; grid-row: 2; }
#sprint {
  position: absolute;
  right: 22px;
  bottom: 35px;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  font-size: 13px;
}
#hint {
  position: absolute;
  bottom: 5px;
  right: 10px;
  color: white;
  font-size: 10px;
  text-shadow: 1px 1px 3px black;
}
</style>
</head>

<body>
<div id="title">🇮🇳 APNA INDIA</div>
<div id="info">OPEN WORLD • DEMO v0.1</div>
<div id="message">Welcome to Delhi!</div>

<div class="controls">
  <button id="up">▲</button>
  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
</div>
<button id="sprint">SPRINT</button>
<div id="hint">WASD / Arrow keys • Mobile buttons</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 180);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
renderer.domElement.id = "game";

// LIGHTING
scene.add(new THREE.HemisphereLight(0xffffff, 0x526044, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-40, 70, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// MATERIALS
const mat = (color) => new THREE.MeshStandardMaterial({ color });

const grassMat = mat(0x568b45);
const roadMat = mat(0x33363a);
const lineMat = mat(0xffffff);
const buildingColors = [
  0xd9c5a4, 0xc7b49b, 0xe1d6c4,
  0xb9c5c8, 0xd6b7a1, 0xb8b8a5
];

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 220),
  grassMat
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.08;
ground.receiveShadow = true;
scene.add(ground);

// ROADS
function road(x, z, w, d) {
  const r = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.12, d), roadMat
  );
  r.position.set(x, 0, z);
  r.receiveShadow = true;
  scene.add(r);
}

road(0, 0, 220, 13);
road(0, 0, 13, 220);
road(0, -45, 220, 10);
road(-45, 0, 10, 220);

// ROAD MARKINGS
function marking(x, z, w, d) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.02, d), lineMat
  );
  m.position.set(x, 0.07, z);
  scene.add(m);
}

for (let x = -100; x < 100; x += 9) {
  marking(x, 0, 4, 0.15);
  marking(x, -45, 4, 0.15);
}
for (let z = -100; z < 100; z += 9) {
  marking(0, z, 0.15, 4);
  marking(-45, z, 0.15, 4);
}

// BUILDINGS
function building(x, z, w, h, d, color) {
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d), mat(color)
  );
  body.position.y = h / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // Roof
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.3, 0.35, d + 0.3),
    mat(0x777777)
  );
  roof.position.y = h + 0.15;
  group.add(roof);

  // Windows
  const windowMat = new THREE.MeshStandardMaterial({
    color: 0x4c8799,
    metalness: 0.2,
    roughness: 0.3
  });

  for (let y = 1.5; y < h - 0.5; y += 2.3) {
    for (let wx = -w / 2 + 1; wx < w / 2 - 0.5; wx += 2.5) {
      const win = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 1.1, 0.08),
        windowMat
      );
      win.position.set(wx, y, d / 2 + 0.05);
      group.add(win);
    }
  }

  group.position.set(x, 0, z);
  scene.add(group);
}

// City blocks
for (let x = -90; x <= 90; x += 24) {
  for (let z = -90; z <= 90; z += 24) {
    if (
      Math.abs(x) < 14 ||
      Math.abs(z) < 14 ||
      (Math.abs(z + 45) < 10) ||
      (Math.abs(x + 45) < 10)
    ) continue;

    const h = 8 + Math.random() * 18;
    const c = buildingColors[
      Math.floor(Math.random() * buildingColors.length)
    ];
    building(x, z, 12, h, 12, c);
  }
}

// TREES
function tree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.4, 3, 8),
    mat(0x704326)
  );
  trunk.position.set(x, 1.5, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2, 10, 8),
    mat(0x246b31)
  );
  leaves.position.set(x, 4, z);
  leaves.castShadow = true;
  scene.add(leaves);
}

for (let i = -90; i <= 90; i += 13) {
  tree(i, 9);
  tree(i, -9);
  tree(9, i);
  tree(-9, i);
}

// STREET LIGHTS
function streetLight(x, z) {
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.16, 5, 8),
    mat(0x333333)
  );
  pole.position.set(x, 2.5, z);
  scene.add(pole);

  const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 10, 8),
    mat(0xffeeaa)
  );
  lamp.position.set(x, 5.1, z);
  scene.add(lamp);
}

for (let i = -80; i <= 80; i += 25) {
  streetLight(i, 8);
  streetLight(8, i);
}

// CARS
function car(x, z, color, rotation = 0) {
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.9, 4),
    mat(color)
  );
  body.position.y = 0.9;
  body.castShadow = true;
  group.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.7, 0.8, 2),
    mat(0x9bc6d6)
  );
  cabin.position.set(0, 1.65, -0.2);
  group.add(cabin);

  for (const xSide of [-1, 1]) {
    for (const zSide of [-1.25, 1.25]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.42, 0.25, 12),
        mat(0x171717)
      );
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(xSide * 1.1, 0.45, zSide);
      group.add(wheel);
    }
  }

  group.position.set(x, 0, z);
  group.rotation.y = rotation;
  scene.add(group);
}

car(18, 3, 0xd52b2b);
car(-18, -3, 0xeeeeee);
car(3, 20, 0x1872c9, Math.PI / 2);
car(-3, -20, 0xe4c42a, Math.PI / 2);

// INDIA GATE-INSPIRED LANDMARK
const gate = new THREE.Group();
const sandstone = mat(0xc99a65);

const pillars = [
  [-5, 0, 1, 10, 2],
  [5, 0, 1, 10, 2],
  [0, 9, 11, 2, 2]
];

for (const p of pillars) {
  const part = new THREE.Mesh(
    new THREE.BoxGeometry(p[2], p[3], p[4]),
    sandstone
  );
  part.position.set(p[0], p[3] / 2, p[1]);
  part.castShadow = true;
  gate.add(part);
}

const top = new THREE.Mesh(
  new THREE.BoxGeometry(12, 1, 3),
  sandstone
);
top.position.y = 10.5;
gate.add(top);

gate.position.set(55, 0, -55);
scene.add(gate);

// PLAYER
const player = new THREE.Group();

const shirt = mat(0x1769aa);
const skin = mat(0xd9a477);
const pants = mat(0x252b35);

const torso = new THREE.Mesh(
  new THREE.BoxGeometry(0.9, 1.25, 0.5), shirt
);
torso.position.y = 1.55;
torso.castShadow = true;
player.add(torso);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 16, 12), skin
);
head.position.y = 2.45;
player.add(head);

for (const x of [-0.25, 0.25]) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.9, 0.35), pants
  );
  leg.position.set(x, 0.45, 0);
  player.add(leg);
}

player.position.set(0, 0, 18);
scene.add(player);

// CHECKPOINT
const checkpoint = new THREE.Mesh(
  new THREE.TorusGeometry(2, 0.25, 12, 32),
  new THREE.MeshStandardMaterial({
    color: 0xffdd22,
    emissive: 0x997700
  })
);
checkpoint.position.set(55, 2, -55);
scene.add(checkpoint);

// CONTROLS
const keys = {};
let sprinting = false;

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function bindButton(id, key) {
  const btn = document.getElementById(id);
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
    btn.setPointerCapture(e.pointerId);
  });
  const stop = e => {
    e.preventDefault();
    keys[key] = false;
  };
  btn.addEventListener("pointerup", stop);
  btn.addEventListener("pointercancel", stop);
  btn.addEventListener("lostpointercapture", stop);
}

bindButton("up", "w");
bindButton("down", "s");
bindButton("left", "a");
bindButton("right", "d");

const sprintBtn = document.getElementById("sprint");
sprintBtn.addEventListener("pointerdown", () => sprinting = true);
sprintBtn.addEventListener("pointerup", () => sprinting = false);
sprintBtn.addEventListener("pointercancel", () => sprinting = false);
sprintBtn.addEventListener("lostpointercapture", () => sprinting = false);

// GAME LOOP
const clock = new THREE.Clock();
const message = document.getElementById("message");

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  let forward = 0;
  let side = 0;

  if (keys["w"] || keys["arrowup"]) forward += 1;
  if (keys["s"] || keys["arrowdown"]) forward -= 1;
  if (keys["a"] || keys["arrowleft"]) side -= 1;
  if (keys["d"] || keys["arrowright"]) side += 1;

  const moving = forward !== 0 || side !== 0;
  const speed = sprinting ? 12 : 6;

  if (moving) {
    const direction = new THREE.Vector3(side, 0, -forward)
      .normalize();

    player.position.addScaledVector(direction, speed * dt);
    player.rotation.y = Math.atan2(direction.x, direction.z);
  }

  // Keep player inside the demo city
  player.position.x = THREE.MathUtils.clamp(
    player.position.x, -103, 103
  );
  player.position.z = THREE.MathUtils.clamp(
    player.position.z, -103, 103
  );

  // Follow camera
  const behind = new THREE.Vector3(
    0, 6, 10
  ).applyQuaternion(player.quaternion);

  const targetCamera = player.position.clone().add(behind);
  camera.position.lerp(targetCamera, 1 - Math.pow(0.001, dt));
  camera.lookAt(
    player.position.x,
    player.position.y + 1.5,
    player.position.z
  );

  // Checkpoint detection
  const distance = player.position.distanceTo(
    new THREE.Vector3(55, 0, -55)
  );

  if (distance < 5) {
    message.textContent = "MISSION COMPLETE! 🇮🇳";
  } else {
    message.textContent = "Explore Delhi • Find the golden checkpoint";
  }

  checkpoint.rotation.y += dt;
  checkpoint.position.y = 2 + Math.sin(clock.elapsedTime * 2) * 0.3;

  renderer.render(scene, camera);
}

camera.position.set(0, 7, 30);
animate();

// RESIZE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
  </html>
